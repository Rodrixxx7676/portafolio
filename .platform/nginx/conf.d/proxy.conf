# Ajustes del nginx que Elastic Beanstalk pone delante de la aplicación Node.
# Los archivos de esta ruta se fusionan con la configuración de la plataforma.

# Los assets de React llevan hash en el nombre, así que se pueden comprimir sin
# riesgo de servir una versión vieja.
gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_proxied any;
gzip_types
  application/javascript
  application/json
  application/xml
  image/svg+xml
  text/css
  text/plain;

# Un portafolio no recibe cargas de archivos: 2 MB sobra y acota el abuso.
client_max_body_size 2M;
