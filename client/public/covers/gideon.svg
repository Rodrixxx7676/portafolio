<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Asistente para macOS">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fdf7f7"/>
      <stop offset="100%" stop-color="#f3d5d5"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="47%" r="46%">
      <stop offset="0%" stop-color="#b40808" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#b40808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="rejilla" width="75" height="75" patternUnits="userSpaceOnUse">
      <path d="M75 0H0V75" fill="none" stroke="#b40808" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="1200" fill="url(#fondo)"/>
  <rect width="900" height="1200" fill="url(#rejilla)"/>
  <circle cx="450" cy="560" r="470" fill="url(#halo)"/>

  <!-- Motivo propio del proyecto, centrado para sobrevivir al recorte. -->
  <g>
    <rect x="230" y="415" width="440" height="290" rx="20" fill="#f9f5f5" stroke="#e4dada" stroke-width="3"/>
    <rect x="230" y="415" width="440" height="52" rx="20" fill="#eccbcb"/>
    <rect x="230" y="450" width="440" height="17" fill="#eccbcb"/>
    <circle cx="266" cy="441" r="9" fill="#b40808"/>
    <circle cx="296" cy="441" r="9" fill="#8f8686"/>
    <circle cx="326" cy="441" r="9" fill="#8f8686"/>
    <text x="266" y="525" font-family="'SF Mono', Menlo, monospace" font-size="26" fill="#b40808">$ gideon --status</text>
    <rect x="266" y="555" width="230" height="9" rx="4" fill="#8f8686"/>
    <rect x="266" y="585" width="310" height="9" rx="4" fill="#8f8686" opacity="0.7"/>
    <rect x="266" y="615" width="170" height="9" rx="4" fill="#8f8686" opacity="0.5"/>
    <rect x="266" y="648" width="20" height="26" fill="#b40808"/>
  </g>

  <!-- El degradado inferior asienta la etiqueta que dibuja la galería encima. -->
  <rect x="0" y="880" width="900" height="320" fill="url(#pie)"/>
  <text x="450" y="1010" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="27" letter-spacing="4" fill="#8f8686">SHELL · MACOS</text>
  <rect x="410" y="1050" width="80" height="3" fill="#b40808"/>
</svg>
