<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Reloj mundial con husos horarios">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0e0e"/>
      <stop offset="45%" stop-color="#1f1414"/>
      <stop offset="100%" stop-color="#4a0f0f"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="47%" r="46%">
      <stop offset="0%" stop-color="#b40808" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b40808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0e0e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f0e0e" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="rejilla" width="75" height="75" patternUnits="userSpaceOnUse">
      <path d="M75 0H0V75" fill="none" stroke="#f9f5f5" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="1200" fill="url(#fondo)"/>
  <rect width="900" height="1200" fill="url(#rejilla)"/>
  <circle cx="450" cy="560" r="470" fill="url(#halo)"/>

  <!-- Las tres capas del patrón: modelo, vista-modelo y vista. -->
  <g>
    <g fill="none" stroke="#e19898" stroke-width="3" opacity="0.75">
      <rect x="285" y="360" width="330" height="96" rx="12"/>
      <rect x="285" y="512" width="330" height="96" rx="12"/>
      <rect x="285" y="664" width="330" height="96" rx="12"/>
    </g>
    <g stroke="#b40808" stroke-width="5" stroke-linecap="round">
      <line x1="450" y1="456" x2="450" y2="512"/>
      <line x1="450" y1="608" x2="450" y2="664"/>
    </g>
    <g fill="#f9f5f5" font-family="Helvetica, Arial, sans-serif" font-size="30" text-anchor="middle">
      <text x="450" y="420">MODEL</text>
      <text x="450" y="572">VIEWMODEL</text>
      <text x="450" y="724">VIEW</text>
    </g>
  </g>

  <!-- El degradado inferior asienta la etiqueta que dibuja la galería encima. -->
  <rect x="0" y="880" width="900" height="320" fill="url(#pie)"/>
  <text x="450" y="1010" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="27" letter-spacing="4" fill="#b5aeae">REACT · TYPESCRIPT · MVVM</text>
  <rect x="410" y="1050" width="80" height="3" fill="#b40808"/>
</svg>
