<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Reloj mundial con husos horarios">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fdf7f7"/>
      <stop offset="100%" stop-color="#f3d5d5"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="47%" r="46%">
      <stop offset="0%" stop-color="#b40808" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#b40808" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="rejilla" width="75" height="75" patternUnits="userSpaceOnUse">
      <path d="M75 0H0V75" fill="none" stroke="#b40808" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="1200" fill="url(#fondo)"/>
  <rect width="900" height="1200" fill="url(#rejilla)"/>
  <circle cx="450" cy="560" r="470" fill="url(#halo)"/>

  <!-- Motivo propio del proyecto, centrado para sobrevivir al recorte. -->
  <g>
    <circle cx="450" cy="560" r="190" fill="none" stroke="#b40808" stroke-width="3" opacity="0.9"/>
    <circle cx="450" cy="560" r="255" fill="none" stroke="#b40808" stroke-width="2" opacity="0.55"/>
    <ellipse cx="450" cy="560" rx="80" ry="190" fill="none" stroke="#b40808" stroke-width="2" opacity="0.45"/>
    <ellipse cx="450" cy="560" rx="150" ry="190" fill="none" stroke="#b40808" stroke-width="2" opacity="0.3"/>
    <line x1="260" y1="560" x2="640" y2="560" stroke="#b40808" stroke-width="2" opacity="0.45"/>
    <line x1="450" y1="560" x2="450" y2="415" stroke="#1a1919" stroke-width="7" stroke-linecap="round"/>
    <line x1="450" y1="560" x2="553" y2="612" stroke="#b40808" stroke-width="7" stroke-linecap="round"/>
    <circle cx="450" cy="560" r="12" fill="#1a1919"/>
  </g>

  <!-- El degradado inferior asienta la etiqueta que dibuja la galería encima. -->
  <rect x="0" y="880" width="900" height="320" fill="url(#pie)"/>
  <text x="450" y="1010" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="27" letter-spacing="4" fill="#8f8686">JAVASCRIPT · REACT · PWA</text>
  <rect x="410" y="1050" width="80" height="3" fill="#b40808"/>
</svg>
